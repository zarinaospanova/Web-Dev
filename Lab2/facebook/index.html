<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Facebook Log In</title>
    <link rel="stylesheet" href = "style.css">
</head>
<body>
      <main class = "box">
        <div class="title-box">
          <img src="https://www.logo.wine/a/logo/Facebook/Facebook-Logo.wine.svg" alt="Facebook logo">
          <p> Facebook helps you connect and share with the people in your life. </p>
        </div>
        <div class = "form-box">
            <form action="#">
              <input type="text" placeholder="Email address or phone number" required>
              <input type="password" placeholder="Password" required>
              <button type="submit">Log In</button>
              <a href="#"> Forgotten Password </a>
            </form>
            <hr>
            <div class="create-btn">
              <a href="#"> Create New Account </a>
            </div>
        </div>
      </main>

      <footer class="footer">
          <div class="footer-content">
              <div class="languages">
                  <span>English (UK)</span>
                  <a href="#">Русский</a>
                  <a href="#">Қазақша</a>
                  <a href="#">Türkçe</a>
                  <button>+</button>
              </div>
              <hr>
              <div class="links">
                  <a href="#">Sign Up</a> <a href="#">Log In</a> <a href="#">Messenger</a>
                  <a href="#">Facebook Lite</a> <a href="#">Video</a> <a href="#">Places</a>
                  <a href="#">Games</a> <a href="#">Marketplace</a> <a href="#">Meta Pay</a>
              </div>
              <p class="copyright">Meta © 2026</p>
          </div>
      </footer>
</body>
</html>
