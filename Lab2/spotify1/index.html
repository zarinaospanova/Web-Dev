<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Spotify Log In </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <section class="registration-card">
        <div class="logo"> Spotify </div>
        <h1> Sign up for free </h1>
        <p class = "subtitle"> Create your account to start listening. </p>

        <form action="#" method="POST">
            <div class = "form-group">
                <label for="email"> Email address </label>
                <input type="email" name="email" id="email" placeholder="name@example.com" required>
                <p class="hint-text">We'll never share your email with anyone.</p>
            </div>
            <div class = "form-group">
                <label for="password"> Password </label>
                <input type="password" name="password" id="password" placeholder="Create a password" required>
                <p class="hint-text">Use 8+ characters for better security.</p>
                <p> </p>
            </div>
            <div class = "form-group">
                <label for = "username"> Username </label>
                <input type="text" name="username" id="username" placeholder="Pick a display name" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <span class="green-text">Terms and Conditions</span></label>
            </div>

            <button type="submit">Sign Up</button>

        </form>

        <p class="login-prompt">
            Already have an account? <a href="#">Log in</a>.
        </p>

    </section>
</main>
</body>
</html>
