<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loops js </title>
</head>
<body>
  <script>
    let i = 3;
    while(i){
      alert(i--);
    }

    let j = 0;
    while(j++ < 5) alert(i);

    for(let k=2;k <= 10; k++){
      if(k%2 == 0){
        alert(k);
      }
    }

    let num;

    do {
      num = prompt("Enter a number greater than 100?", 0);
    } while (num <= 100 && num);


  </script>
</body>
</html>
