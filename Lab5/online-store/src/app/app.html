<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="logo">OS</div>
      <div>
        <div class="title">Online Store</div>
        <div class="subtitle"> with Kaspi </div>
      </div>
    </div>

    <div class="hint">
      <span>Tip:</span> search by name (iphone, sony, ps5...)
    </div>
  </header>

  <!-- 1) Categories -->
  <section class="filters">
    <button class="chip" [class.active]="selectedCategoryId === null" (click)="selectCategory(null)">
      All Products
    </button>

    @for (c of categories; track c.id) {
      <button class="chip" [class.active]="selectedCategoryId === c.id" (click)="selectCategory(c.id)">
        {{ c.name }}
      </button>
    }
  </section>

  <!-- 2) ⭐ Favorites -->
  <section class="favorites">
    <div class="fav-title">⭐ Favorites ({{ favorites.length }})</div>

    @if (favorites.length === 0) {
      <div class="fav-empty">No favorite products yet</div>
    } @else {
      <div class="fav-grid">
        @for (p of favorites; track p.id) {
          <app-product-item
            [product]="p"
            (delete)="deleteProduct($event)"
            (toggleFavorite)="toggleFavorite($event)">
          </app-product-item>
        }
      </div>
    }
  </section>

  <!-- 3) Products list -->
  <section class="content">
    <app-product-list
      [products]="selectedProducts"
      (delete)="deleteProduct($event)"
      (toggleFavorite)="toggleFavorite($event)">
    </app-product-list>
  </section>

  <footer class="footer">
    <span>© {{ year }} Online Store</span>
    <span class="dot">•</span>
    <span class="muted">Made in Angular</span>
  </footer>
</div>
