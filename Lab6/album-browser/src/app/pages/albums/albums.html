<h2>Albums</h2>

@if (loading) {
  <p>Loading...</p>
}

@if (!loading && errorMessage) {
  <p>{{ errorMessage }}</p>
}

@if (!loading && !errorMessage) {
  <p>Total albums: {{ albums.length }}</p>

  <div class="albums-list">
    @for (album of albums; track album.id) {
      <div class="album-card" (click)="openAlbum(album.id)">
        <div class="album-info">
          <h3>{{ album.id }}. {{ album.title }}</h3>
          <p>User ID: {{ album.userId }}</p>
        </div>

        <button class="delete-btn" (click)="deleteAlbum(album.id, $event)">
          Delete
        </button>
      </div>
    }
  </div>
}
